name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: cargo-lint-extra
        # `--force`: rust-cache restores ~/.cargo/.crates.toml but not
        # ~/.cargo/bin, so on a cache hit binstall sees "already installed" and
        # no-ops while the binary is absent — `cargo lint-extra` then fails with
        # "no such command". Reinstalling unconditionally is a prebuilt-binary
        # download, so the cost is negligible.
        #
        # Plain invocation, not `-W`: in cargo-lint-extra 0.1.4 (latest) the
        # `-W` flag exits 1 unconditionally (even on an empty tree). All rules
        # are at `deny`, so a plain run already fails on any finding and passes
        # only when clean — the behavior `-W` was meant to provide.
        run: cargo binstall -y --force cargo-lint-extra && cargo lint-extra

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

  check:
    name: Check
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test failed"
            exit 1
          fi
          echo "All checks passed"
