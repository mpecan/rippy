name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to republish (e.g. rippy-cli-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  publish:
    name: Publish to crates.io
    if: startsWith(inputs.tag || github.event.release.tag_name, 'rippy-cli-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish rippy-cli
        run: |
          LOCAL=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "rippy-cli") | .version')
          PUBLISHED=$(cargo search rippy-cli --limit 1 --color never | sed -n 's/^rippy-cli = "\([^"]*\)".*/\1/p')
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "::notice::rippy-cli@$LOCAL already published, skipping"
          else
            cargo publish
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-binaries:
    # Two mutually exclusive distributions per target: `rippy` (default build,
    # no network code) and `rippy-jev` (`--features jev`, docs/jev.md). Both
    # archives contain a binary named `rippy`, so hook configs never change.
    name: Build ${{ matrix.flavor }} ${{ matrix.target }}
    if: startsWith(inputs.tag || github.event.release.tag_name, 'rippy-cli-v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [rippy, rippy-jev]
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.flavor }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: >-
          cargo build --release --target ${{ matrix.target }}
          ${{ matrix.flavor == 'rippy-jev' && '--features jev' || '' }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # `ring` (rustls, jev build only) compiles C for the target.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

      - name: Package binary
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#rippy-cli-v}"
          ARCHIVE="${{ matrix.flavor }}-v${VERSION}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/rippy" rippy
          tar -czf "${ARCHIVE}" rippy
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          openssl dgst -sha256 "${ARCHIVE}" | awk '{print $2}' > "${ARCHIVE}.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            "${{ env.ARCHIVE }}" \
            "${{ env.ARCHIVE }}.sha256" \
            --clobber

  update-homebrew:
    name: Update Homebrew tap
    needs: build-binaries
    # Runs even if a leg failed (fail-fast is off): each formula is written only
    # when all of its archives exist, so a broken rippy-jev leg never holds back
    # the default formula.
    if: ${{ !cancelled() && startsWith(inputs.tag || github.event.release.tag_name, 'rippy-cli-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute version
        id: version
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          echo "version=${TAG#rippy-cli-v}" >> "$GITHUB_OUTPUT"

      - name: Download SHA256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p sums
          for FLAVOR in rippy rippy-jev; do
            for TARGET in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
              gh release download "${{ env.RELEASE_TAG }}" \
                --repo "${{ github.repository }}" \
                --pattern "${FLAVOR}-v${VERSION}-${TARGET}.tar.gz.sha256" \
                --output "sums/${FLAVOR}-${TARGET}.sha256" \
                || echo "::warning::no ${FLAVOR} archive for ${TARGET}"
            done
          done

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.REPOSITORY_BUTLER_APP_ID }}
          private-key: ${{ secrets.REPOSITORY_BUTLER_PEM }}
          repositories: homebrew-tools

      - name: Checkout homebrew-tools tap
        uses: actions/checkout@v6
        with:
          repository: mpecan/homebrew-tools
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tools

      - name: Update formulas
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PYEOF'
          import os, textwrap
          v = os.environ['VERSION']
          base = "https://github.com/mpecan/rippy/releases/download"
          flavors = {
              "rippy": ("Rippy", "rippy-jev",
                        "Shell command safety hook for AI coding tools (Claude Code, Cursor, Gemini CLI)"),
              "rippy-jev": ("RippyJev", "rippy",
                            "rippy with optional Jev review of uncertain commands (network access)"),
          }
          def sha(flavor, target):
              with open(f"sums/{flavor}-{target}.sha256") as f:
                  return f.read().strip()
          os.makedirs("homebrew-tools/Formula", exist_ok=True)
          targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
          written = []
          for flavor, (cls, other, desc) in flavors.items():
              if not all(os.path.exists(f"sums/{flavor}-{t}.sha256") for t in targets):
                  print(f"::warning::skipping {flavor}.rb: not every archive was built")
                  continue
              written.append(f"Formula/{flavor}.rb")
              def url(target):
                  return f"{base}/rippy-cli-v{v}/{flavor}-v{v}-{target}.tar.gz"
              formula = textwrap.dedent(f"""\
                class {cls} < Formula
                  desc "{desc}"
                  homepage "https://github.com/mpecan/rippy"
                  version "{v}"
                  license "MIT"

                  conflicts_with "{other}", because: "both install a `rippy` binary"

                  on_macos do
                    on_arm do
                      url "{url('aarch64-apple-darwin')}"
                      sha256 "{sha(flavor, 'aarch64-apple-darwin')}"
                    end
                    on_intel do
                      url "{url('x86_64-apple-darwin')}"
                      sha256 "{sha(flavor, 'x86_64-apple-darwin')}"
                    end
                  end

                  on_linux do
                    on_intel do
                      url "{url('x86_64-unknown-linux-gnu')}"
                      sha256 "{sha(flavor, 'x86_64-unknown-linux-gnu')}"
                    end
                  end

                  def install
                    bin.install "rippy"
                  end

                  test do
                    assert_match "rippy", shell_output("#{{bin}}/rippy --version")
                  end
                end
              """)
              with open(f"homebrew-tools/Formula/{flavor}.rb", "w") as f:
                  f.write(formula)
          if not written:
              raise SystemExit("no formula could be written")
          PYEOF

      - name: Commit and push
        working-directory: homebrew-tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/*.rb
          git diff --cached --quiet || git commit -m "rippy ${{ steps.version.outputs.version }}"
          git push
