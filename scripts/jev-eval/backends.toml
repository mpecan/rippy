# System One backends for scripts/jev-eval/eval.py. Every key except `name` and
# `dummy-key` is written into the [jev] section of a generated override config,
# so any JevSettings key (thresholds, allow-effects, timeout-ms) can be set here.
# `dummy-key = true` sets the API-key variable to "local" when it is unset, for
# local servers that need no key.

[[backend]]
name = "jev-remote"
endpoint = "https://openrouter.ai/api/v1/systemone"
model = "jev-1.13"
api-key-env = "OPENROUTER_API_KEY"

# uv run --extra serve python -m kev.serve --run jaredpalmer/kev-4b --port 8009
[[backend]]
name = "kev-4b"
endpoint = "http://127.0.0.1:8009/v1/systemone"
model = "kev-latest"
api-key-env = "LOCAL_JEV_KEY"
dummy-key = true
timeout-ms = 10000

[[backend]]
name = "kev-9b"
endpoint = "http://127.0.0.1:8010/v1/systemone"
model = "kev-latest"
api-key-env = "LOCAL_JEV_KEY"
dummy-key = true
timeout-ms = 10000

# VON_NOUL_DECISION=raw von serve --port 8011 --device mps
# The default "band" mode pushes every noul outside 0.2-0.8, which defeats
# rippy's thresholds; always serve Von with raw nouls.
[[backend]]
name = "von"
endpoint = "http://127.0.0.1:8011/v1/systemone"
model = "von-1.3.0"
api-key-env = "LOCAL_JEV_KEY"
dummy-key = true
timeout-ms = 10000
