[meta]
description = "Declared aws / az / gcloud / gsutil / kubectl / helm allow surfaces, one observed allow case each"

# Most rows here exercise a wildcard surface (`aws <service> admin-get-*`,
# `az <group>... show-*`): rippy approves the shape, not the exact subcommand.
# The service/group word is chosen to be the one that really owns the verb, so
# a reader is not left thinking `aws s3 admin-get-user` is a command.

[[case]]
command = 'aws --help'
decision = "allow"

