[meta]
description = "Wrapper commands must not drop the redirect, heredoc or option guard (#181)"

# nice
[[case]]
command = "nice ls > /etc/passwd"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "nice ls > /tmp/rippy-out.txt"
decision = "allow"

[[case]]
command = "nice cat x > ~/.ssh/authorized_keys"
decision = "ask"
reason_contains = "redirect to ~/.ssh/authorized_keys"

# nohup / strace / ltrace
[[case]]
command = "nohup ls > /etc/passwd"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "nohup echo hello"
decision = "allow"

[[case]]
command = "strace ls > /etc/passwd"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "strace ls"
decision = "allow"

[[case]]
command = "ltrace ls > /etc/passwd"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "ltrace ls > /dev/null"
decision = "allow"

# command / builtin
[[case]]
command = "command echo pwned > /etc/sudoers"
decision = "ask"
reason_contains = "redirect to /etc/sudoers"

[[case]]
command = "command echo pwned > /tmp/note.txt"
decision = "allow"

[[case]]
command = "builtin echo x >> /etc/hosts"
decision = "ask"
reason_contains = "redirect to /etc/hosts"

[[case]]
command = "builtin echo x >> /tmp/output.txt"
decision = "allow"

# timeout — bare form, plus DURATION and option skipping
[[case]]
command = "timeout ls > /etc/passwd"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "timeout ls"
decision = "allow"

[[case]]
command = "timeout 5 ls > /etc/passwd"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "timeout 5 ls"
decision = "allow"

[[case]]
command = "timeout -s KILL 5 ls > /etc/passwd"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "timeout -s KILL 5 ls"
decision = "allow"

[[case]]
command = "timeout 5 rm -rf /"
decision = "ask"
reason_contains = "command=rm"

[[case]]
command = "timeout 5 git status"
decision = "allow"

# An argv that does not match GNU timeout's grammar keeps the fail-closed path
# where the stray word reads as an unknown command.
[[case]]
command = "timeout --bogus 5 ls"
decision = "ask"
reason_contains = "unknown command"

[[case]]
command = "timeout 5s ls"
decision = "allow"

# Nesting, the no-inner-command path, and heredocs on the same redirects slice
[[case]]
command = "nice nohup ls > /etc/passwd"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "nice nohup ls > /tmp/nested.txt"
decision = "allow"

[[case]]
command = "nice > /etc/passwd"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "nice > /tmp/nice.txt"
decision = "allow"

[[case]]
command = "nice cat <<EOF\n$(id)\nEOF"
decision = "ask"
reason_contains = "heredoc with expansion"

[[case]]
command = "nice cat <<'EOF'\nrm -rf /\nEOF"
decision = "allow"

[[case]]
command = "nice ls > /etc/passwd; echo done"
decision = "ask"
reason_contains = "redirect to /etc/passwd"

[[case]]
command = "nice ls > /tmp/x; echo done"
decision = "allow"

# `nice` puts its own options in front of the command, so without skipping them
# the adjustment was read as the command name and an ordinary safe invocation
# Asked. The redirect guard must still survive the skip.
[[case]]
command = "nice -n 10 ls"
decision = "allow"

[[case]]
command = "nice -10 ls"
decision = "allow"

[[case]]
command = "nice --adjustment=5 ls"
decision = "allow"

[[case]]
command = "nice -n 10 ls > /etc/passwd"
decision = "ask"

[[case]]
command = "nice -n"
decision = "ask"

# The env handler once dropped every `-x`/`a=b` word from the inner command, so
# these were judged as `git log`, `find .`, `sed` and allowed.
[[case]]
command = "env git -c core.pager=id log"
decision = "ask"
reason_contains = "safe config allowlist"

[[case]]
command = "env find . -delete"
decision = "ask"
reason_contains = "find -delete"

[[case]]
command = "env sed -i s/a/b/ f"
decision = "ask"
reason_contains = "in-place"

[[case]]
command = "env xargs -0 -n 5"
decision = "ask"
reason_contains = "xargs (no command)"

[[case]]
command = "env -u X ls -la"
decision = "allow"

[[case]]
command = "env CI=1 ls -la"
decision = "allow"

# Re-joined arguments are quoted: a quoted argument is one word, not a list.
[[case]]
command = "timeout 5 mysql -e \"SELECT a-b FROM t; DROP TABLE tmp\""
decision = "ask"
reason_contains = "write SQL"

[[case]]
command = "timeout 5 mysql -e \"SELECT a FROM t\""
decision = "allow"

[[case]]
command = 'find . -exec sh -c "rm -rf x" \;'
decision = "ask"
reason_contains = "rm"

[[case]]
command = '''find . -exec sh -c 'cat {}' \;'''
decision = "ask"

[[case]]
command = 'find . -exec cat {} \;'
decision = "allow"

[[case]]
command = 'find . -exec {} \;'
decision = "ask"

[[case]]
command = 'find . -exec echo x{} \;'
decision = "ask"

[[case]]
command = '''fd -x sh -c 'echo {}''''
decision = "ask"

[[case]]
command = 'fd -x cat {}'
decision = "allow"

[[case]]
command = '''xargs -I{} sh -c 'echo {}''''
decision = "ask"

[[case]]
command = 'xargs -I{} cat {}'
decision = "allow"

[[case]]
command = 'xargs -I {} {}'
decision = "ask"

[[case]]
command = '''xargs --replace=X sh -c 'echo X''''
decision = "ask"

[[case]]
command = 'env -P /tmp ls'
decision = "ask"

[[case]]
command = 'env -C /tmp ls'
decision = "ask"

[[case]]
command = 'env --chdir=/tmp ls'
decision = "ask"

[[case]]
command = 'env -iC/tmp ls'
decision = "ask"

[[case]]
command = '''env -S 'ls -la''''
decision = "allow"

[[case]]
command = '''env -S '''''
decision = "ask"

[[case]]
command = 'env -u HOME ls'
decision = "allow"

[[case]]
command = 'env --unset=HOME ls'
decision = "allow"

[[case]]
command = 'env -i ls'
decision = "allow"

[[case]]
command = 'env -iu HOME ls'
decision = "allow"

[[case]]
command = 'env --frobnicate ls'
decision = "ask"

[[case]]
command = 'env -- CI=1 ls'
decision = "allow"

[[case]]
command = '''env -S 'rm -rf /''''
decision = "ask"

[[case]]
command = 'env --ch /tmp ls'
decision = "ask"

[[case]]
command = 'env --ignore-env ls'
decision = "allow"

# Every re-joining site quotes: the SQL stays one argument, so the write in it is
# seen as SQL rather than as a separate `DROP` command.

[[case]]
command = 'env mysql -e "SELECT a FROM t; DROP TABLE tmp"'
decision = "ask"
reason_contains = "write SQL"

[[case]]
command = 'env mysql -e "SELECT a FROM t"'
decision = "allow"

[[case]]
command = 'xargs mysql -e "SELECT a FROM t; DROP TABLE tmp"'
decision = "ask"
reason_contains = "write SQL"

[[case]]
command = 'xargs mysql -e "SELECT a FROM t"'
decision = "allow"

[[case]]
command = 'find . -exec mysql -e "SELECT a FROM t; DROP TABLE tmp" \;'
decision = "ask"
reason_contains = "write SQL"

[[case]]
command = 'find . -exec mysql -e "SELECT a FROM t" \;'
decision = "allow"

[[case]]
command = 'fd -x mysql -e "SELECT a FROM t; DROP TABLE tmp"'
decision = "ask"
reason_contains = "write SQL"

[[case]]
command = 'fd -x mysql -e "SELECT a FROM t"'
decision = "allow"

[[case]]
command = 'uv run mysql -e "SELECT a FROM t; DROP TABLE tmp"'
decision = "ask"
reason_contains = "write SQL"

[[case]]
command = 'uv run mysql -e "SELECT a FROM t"'
decision = "allow"

[[case]]
command = 'tokf run mysql -e "SELECT a FROM t; DROP TABLE tmp"'
decision = "ask"
reason_contains = "write SQL"

[[case]]
command = 'tokf run mysql -e "SELECT a FROM t"'
decision = "allow"

[[case]]
command = 'docker exec c mysql -e "SELECT a FROM t; DROP TABLE tmp"'
decision = "ask"
reason_contains = "write SQL"

[[case]]
command = 'docker exec c mysql -e "SELECT a FROM t"'
decision = "allow"

[[case]]
command = 'kubectl exec pod -- mysql -e "SELECT a FROM t; DROP TABLE tmp"'
decision = "ask"
reason_contains = "write SQL"

[[case]]
command = 'kubectl exec pod -- mysql -e "SELECT a FROM t"'
decision = "allow"

[[case]]
command = 'env -i -- ls -la'
decision = "allow"

[[case]]
command = 'env -i -- rm -rf x'
decision = "ask"

# GNU env splices the -S words into argv in place of the option and keeps
# going, so the words after the payload still run.
[[case]]
command = "env -S 'CI=1' rm -rf x"
decision = "ask"
reason_contains = "rm"

[[case]]
command = "env --split-string='CI=1' rm x"
decision = "ask"
reason_contains = "rm"

[[case]]
command = "env -S 'LD_PRELOAD=x' ls"
decision = "ask"

[[case]]
command = "env -S 'ls' -C /x"
decision = "allow"

[[case]]
command = "env -iS 'ls' -la"
decision = "allow"

# Only the words before the command are env's assignments; `a=b` after it is
# the command's argument.
[[case]]
command = "env grep a=b f"
decision = "allow"

[[case]]
command = "env FOO=1 ls"
decision = "ask"
reason_contains = "unrecognized env-var assignment"

# env's own assignments stay a prefix of the recursed command, so the
# analyzer's env-name gate combines with the command's verdict.
[[case]]
command = "env LD_PRELOAD=x ls"
decision = "ask"
reason_contains = "LD_PRELOAD"

[[case]]
command = "env CI='a b' LANG=C ls -la"
decision = "allow"

[[case]]
command = 'env -S "X=1 rm -rf /"'
decision = "ask"
reason_contains = "rm"

# env stops reading options at its first assignment: `-i` here is the command.
[[case]]
command = "env CI=1 -i ls"
decision = "ask"
