[meta]
description = "Static expansion resolution (arithmetic, brace, ranges) — command -> decision"

# Added from cargo-mutants survivors in src/resolve.rs (see docs/mutation-testing.md).
# resolve.rs decides what a command *really is* before analysis, so an operator
# that silently stops resolving turns a resolvable word into `Unresolvable` — the
# analyzer then Asks. That direction is safe, which is why none of these had a
# test: nothing failed. They are pinned here because the same code paths are one
# refactor away from resolving *wrongly* rather than not at all.
#
# Every decision below was taken from observed full-pipeline output, not from the
# handler's raw Classification.

# ---- arithmetic operators ----
# Each arm of apply_binary/apply_unary had no case; deleting an arm falls through
# to `_ => None` -> Unresolvable -> Ask, so a plain `allow` pins the arm.

[[case]]
command = 'echo $((5-3))'
decision = "allow"

[[case]]
command = 'echo $((2**3))'
decision = "allow"

[[case]]
command = 'echo $((1<<3))'
decision = "allow"

[[case]]
command = 'echo $((8>>2))'
decision = "allow"

[[case]]
command = 'echo $((6&3))'
decision = "allow"

[[case]]
command = 'echo $((6|3))'
decision = "allow"

[[case]]
command = 'echo $((6^3))'
decision = "allow"

[[case]]
command = 'echo $((6/3))'
decision = "allow"

[[case]]
command = 'echo $((7%3))'
decision = "allow"

[[case]]
command = 'echo $((+5))'
decision = "allow"

[[case]]
command = 'echo $((~5))'
decision = "allow"

[[case]]
command = 'echo $((!5))'
decision = "allow"

# Division by zero stays Unresolvable — the dangerous neighbour for the `/` and
# `%` guard arms above.
[[case]]
command = 'echo $((1/0))'
decision = "ask"

# `0` and a plain multi-digit decimal both sit on the octal-detection boundary in
# parse_arith_number; several mutants there send one or the other into
# from_str_radix(.., 8) and fail closed.
[[case]]
command = 'echo $((0))'
decision = "allow"

[[case]]
command = 'echo $((99))'
decision = "allow"

# ---- brace expansion ----

# Zero-anchored range: `-` mutated to `/` divides by zero and panics the hook.
[[case]]
command = 'echo {0..3}'
decision = "allow"

[[case]]
command = 'echo {1000..1005}'
decision = "allow"

# Nested/escaped closing brace must defer, not expand. The obvious `{a,{b,c}}`
# does NOT pin this: its inner contains both braces, so the mutated `&&` still
# trips. Only an inner carrying `}` without `{` distinguishes them.
[[case]]
command = 'echo {a,b\}}'
decision = "ask"

# Multi-character range endpoints are not a range — bash leaves `{ab..c}`
# literal. A mutant here fabricates an expansion the shell would never perform.
[[case]]
command = 'echo {ab..c}'
decision = "ask"

# Cap boundary: exactly MAX_BRACE_EXPANSION (1024) resolves, one more defers.
[[case]]
command = 'echo {1..32}{1..32}'
decision = "allow"

[[case]]
command = 'echo {1..33}{1..32}'
decision = "ask"

# A lone `<` in an expanded value is not a process substitution.
[[case]]
command = 'echo ${RIPPY_UNSET_XYZ:-a<b}'
decision = "allow"
