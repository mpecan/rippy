[meta]
description = "Declared npm / deno allow surfaces, one observed allow case each"

[[case]]
command = 'deno eval "console.log(1)"'
decision = "allow"

# Deno.args/Deno.cwd() touch the Deno global but are not in the dangerous-members
# denylist -- proves the #186 fix is scoped, not a blanket Deno.* block.
[[case]]
command = "deno eval 'console.log(Deno.args)'"
decision = "allow"

[[case]]
command = "deno eval 'console.log(Deno.cwd())'"
decision = "allow"

