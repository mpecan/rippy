decision = "allow"

# Curl safe operations
[[case]]
command = "curl https://api.example.com"
decision = "allow"

# Find safe operations
[[case]]
command = 'find . -name "*.rs" -type f'
decision = "allow"

[[case]]
command = 'find . -name "*.rs" -exec grep TODO {} \;'
decision = "allow"

# Sed safe operations
[[case]]
command = "sed 's/old/new/g' file.txt"
decision = "allow"

# Awk safe operations
[[case]]
command = "awk '{print $1}' file.txt"
decision = "allow"

# Fd safe operations
[[case]]
command = "fd -e rs"
decision = "allow"

# Python safe inline
[[case]]
command = """python -c 'print("hello")'"""
decision = "allow"

# Xargs safe
[[case]]
command = "xargs -n 5 -P 4 grep pattern"
decision = "allow"

# Env safe
[[case]]
command = "env FOO=bar ls"
decision = "allow"

[[case]]
command = "env A=1 B=2 echo hello"
decision = "allow"

# Task runner safe operations (Issue #135)
[[case]]
command = "just --list"
decision = "allow"

[[case]]
command = "just --summary"
decision = "allow"

[[case]]
command = "just --dump"
decision = "allow"

[[case]]
command = "mise tasks"
decision = "allow"

[[case]]
command = "mise ls"
decision = "allow"

[[case]]
command = "mise current"
decision = "allow"

[[case]]
command = "mise doctor"
decision = "allow"

[[case]]
command = "tokf raw last"
decision = "allow"

[[case]]
command = "tokf ls"
decision = "allow"

[[case]]
command = "tokf which cargo"
decision = "allow"

[[case]]
command = "tokf show cargo"
decision = "allow"

[[case]]
command = "tokf run git status"
decision = "allow"

[[case]]
command = "mise tasks ls"
decision = "allow"

[[case]]
command = "mise tasks info build"
decision = "allow"

[[case]]
command = "tokf test git status"
decision = "allow"

[[case]]
command = "tokf summary git log"
decision = "allow"

# Local variable-binding scope (issue #132): a variable bound within the command
# — for/select loop var, literal prior assignment, env prefix, or shell status
# var — no longer forces Ask for a command that is safe regardless of arg values.
[[case]]
command = "for i in 1 2 3; do echo $i; done"
decision = "allow"

[[case]]
command = "for f in *.rs; do wc -l $f; done"
decision = "allow"

[[case]]
command = "SCRATCH=/tmp/x; ls $SCRATCH"
decision = "allow"

[[case]]
command = "DIR=/tmp ls $DIR"
decision = "allow"

[[case]]
command = "echo $?"
decision = "allow"

[[case]]
command = "echo ${PIPESTATUS[0]}"
decision = "allow"

# `select` loops bind their iteration variable just like `for`; a safe-list body
# resolves the same way.
[[case]]
command = "select x in a b; do echo $x; done"
decision = "allow"
