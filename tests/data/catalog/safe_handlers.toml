[meta]
description = "Safe handler operations — git, docker, cargo, curl"

# Env-var prefix must not hide the real command from config rules (issue #133).
[[case]]
command = "INSTA_UPDATE=always cargo test"
decision = "allow"

[[case]]
command = "RUST_LOG=debug cargo build"
decision = "allow"

[[case]]
command = "A=1 B=2 cargo test"
decision = "allow"

[[case]]
command = "FOO=bar ls"
decision = "allow"

# Env prefix on the first command of a pipeline/list is still stripped (issue
# #133), but as of #155 a whole-string ALLOW no longer short-circuits a compound
# command: these fall through to the AST walk, where cargo has no leaf handler and
# defaults to Ask. Gating the chain is the intended fail-closed trade — the raw
# command that once matched here is exactly the chaining-bypass vector.
[[case]]
command = "RUST_LOG=debug cargo test | grep foo"
decision = "ask"

[[case]]
command = "INSTA_UPDATE=always cargo test && cargo build"
decision = "ask"

[[case]]
command = "A=1 cargo build ; cargo test"
decision = "ask"

# Git safe subcommands
[[case]]
command = "git log --oneline -20"
decision = "allow"

[[case]]
command = "git diff --cached"
decision = "allow"

[[case]]
command = "git show HEAD"
decision = "allow"

[[case]]
command = "git blame src/main.rs"
decision = "allow"

[[case]]
command = "git branch"
decision = "allow"

[[case]]
command = "git stash list"
decision = "allow"

[[case]]
command = "git remote"
decision = "allow"

[[case]]
command = "git tag --list"
decision = "allow"

