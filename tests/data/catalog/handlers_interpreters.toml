[meta]
description = "Interpreter handlers (ruby/perl/python/node/deno) — command -> decision"

# Cases migrated from src/handlers/{ruby,perl,python,node}.rs unit tests.
# Each decision was authored from OBSERVED full-pipeline analyzer output, not the
# raw handler Classification. For ruby/perl/node the isolated stdlib config has a
# catch-all `command=<name>` rule that Asks, so only version/help Allows here and
# every other invocation (even a "safe" -e) fails CLOSED to Ask. The handler-level
# distinction between safe/dangerous inline code stays covered by white-box tests.

# ---- ruby / irb ----
[[case]]
command = "ruby --version"
decision = "allow"

# Pipeline fails closed: even safe inline `-e` Asks under the isolated config.
[[case]]
command = "ruby -e 'puts 1'"
decision = "allow"

[[case]]
command = "ruby -e \"system('rm -rf /')\""
decision = "ask"

[[case]]
command = "ruby -e '`ls`'"
decision = "ask"

# #159: bare (no-parens) system/exec/spawn calls are standard Ruby syntax and
# were missed by the old parens-only denylist entries.
[[case]]
command = "ruby -e 'system \"id\"'"
decision = "ask"

[[case]]
command = "ruby -e 'puts \"id\"'"
decision = "allow"

[[case]]
command = "ruby -e 'exec \"id\"'"
decision = "ask"

[[case]]
command = "ruby -e 'puts 1+1'"
decision = "allow"

[[case]]
command = "ruby -e 'spawn \"id\"'"
decision = "ask"

# #159: %x with an arbitrary delimiter was missed by the old enumerated
# %x( %x{ %x[ %x| list. %w[...] (word-array literal) must keep Allowing.
[[case]]
command = "ruby -e '%x/id/'"
decision = "ask"

[[case]]
command = "ruby -e 'puts %w[a b]'"
decision = "allow"

[[case]]
command = "ruby"
decision = "ask"

[[case]]
command = "irb"
decision = "ask"

[[case]]
command = "ruby nonexistent_ruby_xyz.rb"
decision = "ask"

# ---- perl ----
[[case]]
command = "perl --version"
decision = "allow"

[[case]]
command = "perl -e 'print \"hi\\n\"'"
decision = "allow"

[[case]]
command = "perl -e \"system('rm -rf /')\""
decision = "ask"

[[case]]
command = "perl -e '`ls`'"
decision = "ask"

[[case]]
command = "perl -E \"system('ls')\""
decision = "ask"

# #159: qx with an arbitrary delimiter (no-parens/braces form) was missed by the
# old enumerated qx( qx{ qx[ qx| list.
[[case]]
command = "perl -e 'qx/id/'"
decision = "ask"

# #159: bare exec/system calls without parens or a space before the argument.
[[case]]
command = "perl -e 'exec\"id\"'"
decision = "ask"

[[case]]
command = "perl -e 'system\"id\"'"
decision = "ask"

# #159: only the first -e fragment was analyzed; a dangerous call in a later
# fragment (which Perl concatenates with the first at runtime) was missed.
[[case]]
command = "perl -e 1 -e 'system(\"id\")'"
decision = "ask"

[[case]]
command = "perl -e 1 -e 'print 1'"
decision = "allow"

# #159: the s///e substitution flag evaluates the replacement as Perl code.
[[case]]
command = "perl -e 's/x/id/e'"
decision = "ask"

[[case]]
command = "perl -e 's/x/y/'"
decision = "allow"

[[case]]
command = "perl"
decision = "ask"

[[case]]
command = "perl nonexistent_perl_xyz.pl"
decision = "ask"

# ---- python (handler-driven: safe inline Allows) ----
[[case]]
command = "python --version"
decision = "allow"

[[case]]
command = "python3 --version"
decision = "allow"

[[case]]
command = "python -c 'print(1)'"
decision = "allow"

[[case]]
command = "python -c 'import json; print(json.dumps({}))'"
decision = "allow"

[[case]]
command = "python -c 'import os; os.system(\"ls\")'"
decision = "ask"

[[case]]
command = "python -c \"eval('1+1')\""
decision = "ask"

[[case]]
command = "python nonexistent_py_xyz.py"
decision = "ask"

[[case]]
command = "python"
decision = "ask"

[[case]]
command = "python -m json.tool"
decision = "allow"

[[case]]
command = "python -m http.server"
decision = "ask"

# ---- node / deno ----
[[case]]
command = "node --version"
decision = "allow"

[[case]]
command = "node -e \"console.log('hi')\""
decision = "allow"

[[case]]
command = "node -e \"require('child_process').execSync('ls')\""
decision = "ask"

[[case]]
command = "node -e \"require('fs').rmSync('/')\""
decision = "ask"

[[case]]
command = "node -p \"eval('1+1')\""
decision = "ask"

# #159: process.binding is a low-level escape hatch not covered by the
# existing require()/child_process checks.
[[case]]
command = "node -e 'process.binding(\"spawn_sync\")'"
decision = "ask"

[[case]]
command = "node -e 'console.log(1)'"
decision = "allow"

[[case]]
command = "node"
decision = "ask"

[[case]]
command = "node -i"
decision = "ask"

[[case]]
command = "node nonexistent_node_xyz.js"
decision = "ask"

[[case]]
command = "deno eval \"require('child_process').exec('ls')\""
decision = "ask"
