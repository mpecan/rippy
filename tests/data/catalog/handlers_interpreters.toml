[meta]
description = "Interpreter handlers (ruby/perl/python/node/deno) — command -> decision"

# Cases migrated from src/handlers/{ruby,perl,python,node}.rs unit tests.
# Each decision was authored from OBSERVED full-pipeline analyzer output, not the
# raw handler Classification. For ruby/perl/node the isolated stdlib config has a
# catch-all `command=<name>` rule that Asks, so only version/help Allows here and
# every other invocation (even a "safe" -e) fails CLOSED to Ask. The handler-level
# distinction between safe/dangerous inline code stays covered by white-box tests.

# ---- ruby / irb ----
[[case]]
command = "ruby --version"
decision = "allow"

# Pipeline fails closed: even safe inline `-e` Asks under the isolated config.
[[case]]
command = "ruby -e 'puts 1'"
decision = "allow"

[[case]]
command = "ruby -e \"system('rm -rf /')\""
decision = "ask"

[[case]]
command = "ruby -e '`ls`'"
decision = "ask"

# #159: bare (no-parens) system/exec/spawn calls are standard Ruby syntax and
# were missed by the old parens-only denylist entries.
[[case]]
command = "ruby -e 'system \"id\"'"
decision = "ask"

[[case]]
command = "ruby -e 'puts \"id\"'"
decision = "allow"

[[case]]
command = "ruby -e 'exec \"id\"'"
decision = "ask"

[[case]]
command = "ruby -e 'puts 1+1'"
decision = "allow"

[[case]]
command = "ruby -e 'spawn \"id\"'"
decision = "ask"

# #159: %x with an arbitrary delimiter was missed by the old enumerated
# %x( %x{ %x[ %x| list. %w[...] (word-array literal) must keep Allowing.
[[case]]
command = "ruby -e '%x/id/'"
decision = "ask"

[[case]]
command = "ruby -e 'puts %w[a b]'"
decision = "allow"

# #182: the word scan sliced the source at raw byte offsets, so a multi-byte
# character anywhere in `-e` crashed the hook (a crash is a fail-open — the
# caller sees a non-blocking error, not a verdict).
[[case]]
command = "ruby -e '%x+їd/'"
decision = "ask"

[[case]]
command = "ruby -e 'puts їx'"
decision = "allow"

[[case]]
command = "ruby"
decision = "ask"

[[case]]
command = "irb"
decision = "ask"

[[case]]
command = "ruby nonexistent_ruby_xyz.rb"
decision = "ask"

# #159 (review follow-up): IO.popen/File.* without parens are standard Ruby
# call syntax and were missed by the old paren-anchored substring denylist.
[[case]]
command = "ruby -e 'IO.popen \"id\"'"
decision = "ask"

[[case]]
command = "ruby -e 'IO.popen(\"id\")'"
decision = "ask"

[[case]]
command = "ruby -e 'File.write \"/tmp/x\",\"d\"'"
decision = "ask"

[[case]]
command = "ruby -e 'File.write(\"/tmp/x\",\"d\")'"
decision = "ask"

[[case]]
command = "ruby -e 'File.open \"/tmp/x\",\"w\"'"
decision = "ask"

[[case]]
command = "ruby -e 'File.delete \"/tmp/x\"'"
decision = "ask"

# ---- perl ----
[[case]]
command = "perl --version"
decision = "allow"

[[case]]
command = "perl -e 'print \"hi\\n\"'"
decision = "allow"

[[case]]
command = "perl -e \"system('rm -rf /')\""
decision = "ask"

[[case]]
command = "perl -e '`ls`'"
decision = "ask"

[[case]]
command = "perl -E \"system('ls')\""
decision = "ask"

# #159: qx with an arbitrary delimiter (no-parens/braces form) was missed by the
# old enumerated qx( qx{ qx[ qx| list.
[[case]]
command = "perl -e 'qx/id/'"
decision = "ask"

# #159: bare exec/system calls without parens or a space before the argument.
[[case]]
command = "perl -e 'exec\"id\"'"
decision = "ask"

[[case]]
command = "perl -e 'system\"id\"'"
decision = "ask"

# #182: same raw-byte slicing crash as ruby, in perl's word scan.
[[case]]
command = "perl -e 'system їid'"
decision = "ask"

[[case]]
command = "perl -e 'print їx'"
decision = "allow"

# #159: only the first -e fragment was analyzed; a dangerous call in a later
# fragment (which Perl concatenates with the first at runtime) was missed.
[[case]]
command = "perl -e 1 -e 'system(\"id\")'"
decision = "ask"

[[case]]
command = "perl -e 1 -e 'print 1'"
decision = "allow"

# #159: the s///e substitution flag evaluates the replacement as Perl code.
[[case]]
command = "perl -e 's/x/id/e'"
decision = "ask"

[[case]]
command = "perl -e 's/x/y/'"
decision = "allow"

[[case]]
command = "perl"
decision = "ask"

[[case]]
command = "perl nonexistent_perl_xyz.pl"
decision = "ask"

# #159 (review follow-up): Perl's open() is routinely called without parens;
# pipe-open (shell exec) and write-mode open (file write) must still Ask.
[[case]]
command = "perl -e 'open FH, \"| sh\"'"
decision = "ask"

[[case]]
command = "perl -e 'open(FH, \"| sh\")'"
decision = "ask"

[[case]]
command = "perl -e 'open FH,\">/tmp/pwn\"; print FH \"x\"'"
decision = "ask"

[[case]]
command = "perl -e 'open my $fh, \">\", \"/tmp/x\"'"
decision = "ask"

# Contrast: a plain no-paren read-mode open must still Allow.
[[case]]
command = "perl -e 'open FH, \"input.txt\"'"
decision = "allow"

# ---- python (handler-driven: safe inline Allows) ----
[[case]]
command = "python --version"
decision = "allow"

[[case]]
command = "python3 --version"
decision = "allow"

[[case]]
command = "python -c 'print(1)'"
decision = "allow"

[[case]]
command = "python -c 'import json; print(json.dumps({}))'"
decision = "allow"

[[case]]
command = "python -c 'import os; os.system(\"ls\")'"
decision = "ask"

[[case]]
command = "python -c \"eval('1+1')\""
decision = "ask"

[[case]]
command = "python nonexistent_py_xyz.py"
decision = "ask"

[[case]]
command = "python"
decision = "ask"

[[case]]
command = "python -m json.tool"
decision = "allow"

[[case]]
command = "python -m http.server"
decision = "ask"

# ---- node / deno ----
[[case]]
command = "node --version"
decision = "allow"

[[case]]
command = "node -e \"console.log('hi')\""
decision = "allow"

[[case]]
command = "node -e \"require('child_process').execSync('ls')\""
decision = "ask"

[[case]]
command = "node -e \"require('fs').rmSync('/')\""
decision = "ask"

[[case]]
command = "node -p \"eval('1+1')\""
decision = "ask"

# #159: process.binding is a low-level escape hatch not covered by the
# existing require()/child_process checks.
[[case]]
command = "node -e 'process.binding(\"spawn_sync\")'"
decision = "ask"

[[case]]
command = "node -e 'console.log(1)'"
decision = "allow"

[[case]]
command = "node"
decision = "ask"

[[case]]
command = "node -i"
decision = "ask"

[[case]]
command = "node nonexistent_node_xyz.js"
decision = "ask"

[[case]]
command = "deno eval \"require('child_process').exec('ls')\""
decision = "ask"

# ---- offset-0 blind spot (cargo-mutants survivors; docs/mutation-testing.md) ----
# Every pre-existing test in perl_safety/ruby_safety/node_safety placed the
# dangerous token at byte 0 of the script. Six fail-open mutants survived because
# of it: each collapses a "preceded by a word byte" boundary check into
# "position == 0", or shrinks the scan range, so a single leading statement hides
# the payload. The cases below put the token deliberately late.

[[case]]
command = "perl -e 'print 1; open(FH, \">/tmp/x\")'"
decision = "ask"

[[case]]
command = "perl -e 'my $d = 1234567890; open(my $fh, \">\", \"/tmp/x\")'"
decision = "ask"

[[case]]
command = "perl -e 'print 1; s/x/id/e'"
decision = "ask"

# `unlink` with no argument defaults to $_, so `find . | perl -l -n -e unlink`
# really does delete; the source is exactly as long as the word it matches.
[[case]]
command = "perl -n -e 'unlink'"
decision = "ask"

[[case]]
command = "ruby -e 'puts %x(id)'"
decision = "ask"

[[case]]
command = "ruby -e 'puts 1; %x(id)'"
decision = "ask"

# Parenthesised require is not the idiomatic form, so only the bare form was tested.
[[case]]
command = "ruby -e \"require('socket')\""
decision = "ask"

[[case]]
command = "ruby -e 'system'"
decision = "ask"

# Safe neighbours: these pin the fail-CLOSED direction of the same predicates —
# ordinary string data that must not be mistaken for a substitution or %x literal.
[[case]]
command = "perl -e 'print \"as/b/c/east\"'"
decision = "allow"

[[case]]
command = "perl -e 'print $s'"
decision = "allow"

[[case]]
command = "perl -e 'print \"s2a2b2end\"'"
decision = "allow"

[[case]]
command = "perl -e 'print \"s a b end\"'"
decision = "allow"

[[case]]
command = "perl -e 'print \"s: ok\"'"
decision = "allow"

[[case]]
command = "ruby -e 'puts 5 %'"
decision = "allow"

[[case]]
command = "ruby -e 'puts \"a%x(b)\"'"
decision = "allow"

# Identifiers merely containing `Deno` must not be treated as the Deno global.
[[case]]
command = "node -e 'const myDeno = x; myDeno.removeSync(\"/tmp/y\")'"
decision = "allow"

[[case]]
command = "node -e 'const $Deno = x; $Deno.removeSync(\"/tmp/y\")'"
decision = "allow"

[[case]]
command = "node -e 'const _Deno = x; _Deno.removeSync(\"/tmp/y\")'"
decision = "allow"
